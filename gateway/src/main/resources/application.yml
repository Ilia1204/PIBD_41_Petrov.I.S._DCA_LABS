spring:
  application:
    name: gateway

  cloud:
    gateway:
      routes:
        - id: disk-service
          uri: ${DISK_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/disks/**
        - id: report-service
          uri: ${REPORT_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/reports/**

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
