spring:
  application:
    name: disk-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/disk_rental}
    username: ${SPRING_DATASOURCE_USERNAME:disk}
    password: ${SPRING_DATASOURCE_PASSWORD:disk}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

server:
  port: ${SERVER_PORT:8081}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTLP_ENDPOINT:http://localhost:8200/v1/traces}

app:
  security:
    jwt-secret: ${JWT_SECRET:dev-only-secret-key-change-me-in-production-32-bytes-min}
    jwt-expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
    admin-username: ${ADMIN_USERNAME:admin}
    # bcrypt-хэш пароля "admin123", задаётся через env в проде
    admin-password-hash: ${ADMIN_PASSWORD_HASH:$2y$05$blr7Vf.KPovYIEe0t.O4J.rR40Urn2d.PYUfuWaYjX.O1ygj1IKVG}
