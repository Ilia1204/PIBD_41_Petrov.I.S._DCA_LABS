spring:
  application:
    name: report-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/disk_rental}
    username: ${SPRING_DATASOURCE_USERNAME:disk}
    password: ${SPRING_DATASOURCE_PASSWORD:disk}

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    listener:
      simple:
        # сообщение, обработчик которого упал, не крутим в очереди бесконечно, а сразу в DLQ
        default-requeue-rejected: false

server:
  port: ${SERVER_PORT:8082}

outbox:
  max-retries: 5

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTLP_ENDPOINT:http://localhost:8200/v1/traces}
