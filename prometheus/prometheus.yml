global:
  scrape_interval: 10s

scrape_configs:
  - job_name: disk-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['disk-service:8081']

  - job_name: report-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['report-service:8082']

  - job_name: file-storage-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['file-storage-service:8083']

  - job_name: gateway
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['gateway:8080']

  - job_name: eureka-server
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['eureka-server:8761']
